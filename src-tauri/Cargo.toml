[package]
name = "inode"
version = "0.3.0"
description = "Inode file manager"
license = "MIT"
authors = ["Matt Barr"]
edition = "2021"

[lib]
name = "inode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "chrono"] }
chrono = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
