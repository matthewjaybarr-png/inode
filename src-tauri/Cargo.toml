[package]
name = "inode"
version = "0.7.2"
description = "Inode file manager"
license = "GPL-3.0-or-later"
authors = ["Matt Barr"]
edition = "2021"

[lib]
name = "inode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "chrono"] }
chrono = "0.4"
tauri-plugin-single-instance = "2"
base64 = "0.23" # already in the tree through tauri
toml = "1" # custom action files; already in the tree through tauri-utils

[target.'cfg(not(windows))'.dependencies]
# The clipboard holder (clip::hold) offers text/uri-list AND x-special/gnome-copied-files at once; wl-copy and
# xclip offer one type per run.
wl-clipboard-rs = "0.9"
x11rb = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5" # same crate the single-instance plugin already brings in

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
