[package]
name = "inode"
version = "0.4.0"
description = "Inode file manager"
license = "MIT"
authors = ["Matt Barr"]
edition = "2021"

[lib]
name = "inode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate", "chrono"] }
chrono = "0.4"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5" # same crate the single-instance plugin already brings in

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
base64 = "0.23"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
