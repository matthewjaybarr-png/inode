<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inode</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="actions" role="toolbar" aria-label="File actions">
    <button id="btn-new" aria-describedby="act-where" title="New folder in the active pane's folder (Ctrl+Shift+N)">+ New folder</button>
    <button id="btn-newfile" aria-describedby="act-where" title="New file in the active pane's folder (Ctrl+Alt+N)">+ New file</button>
    <button id="btn-trash" aria-describedby="act-where" title="Delete (Delete key); Shift+Delete deletes permanently">Delete</button>
    <button id="btn-rename" title="Rename (F2)">Rename</button>
    <button id="btn-undo" title="Undo the last new folder or file, rename, move, copy, extract or delete (Ctrl+Z)" disabled>Undo</button>
    <button id="btn-redo" title="Redo what Undo just took back (Ctrl+Shift+Z or Ctrl+Y)" disabled>Redo</button>
    <span id="act-where"></span>
  </div>
  <div id="app">
    <nav id="sidebar" aria-label="Places"></nav>
    <main id="panes">
      <section class="pane" data-side="0"></section>
      <div class="splitter" role="separator" aria-orientation="vertical" title="Drag to resize; double-click to make equal"></div>
      <section class="pane" data-side="1"></section>
    </main>
    <aside id="preview" aria-label="Preview" hidden><div id="preview-head"></div><div id="preview-body"></div></aside>
  </div>
  <div id="keys" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" hidden>
    <div class="keys-card">
      <header><strong>Keyboard shortcuts</strong><label>Key set <select aria-label="Key set"></select></label><button class="keys-close" title="Close (Esc)">Close</button></header>
      <div class="keys-body"></div>
    </div>
  </div>
  <div id="props" role="dialog" aria-modal="true" aria-label="Properties" hidden>
    <div class="keys-card props-card">
      <header><strong></strong><button class="props-close" title="Close (Esc)">Close</button></header>
      <dl class="keys-body"></dl>
    </div>
  </div>
  <div id="prompt" role="alertdialog" aria-live="assertive" hidden></div>
  <div id="progress" role="status" hidden><span class="label"></span><span class="bar"><i></i></span></div>
  <footer id="status"><span id="status-left"></span><span id="status-right"></span>
    <span id="status-tools">
      <button id="btn-copy" title="Copy the selection to the other pane (Ctrl+Shift+C)">Copy ⇢</button>
      <button id="btn-move" title="Move the selection to the other pane (Ctrl+Shift+X)">Move ⇢</button>
      <span class="sep"></span>
      <button id="btn-swap" title="Swap the two panes' folders (Ctrl+U)" aria-label="Swap folders">⇄ Swap</button>
      <button id="btn-preview" title="Show or hide the preview column (Alt+P)" aria-pressed="false">Preview</button>
      <button id="btn-theme" title="Choose the theme for this app or for the whole suite">Theme</button>
      <button id="btn-keys" title="Keyboard shortcuts (? or F1)">Keys ?</button>
      <button id="btn-dual" title="Show or hide the second pane (F3)" aria-label="Second pane">◫ Two panes</button>
    </span></footer>
</body>
</html>
